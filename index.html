<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Random Quote Generator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      text-align: center;
      background-color: #add8e6
    }
    #quote-box {
      padding: 20px;
      max-width: 500px;
      margin: auto;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: #8EBAC7;
      font-size: 1.2em;
    }
    #author {
      margin-top: 10px;
      font-size: 1em;
      color: #555;
    }
    button {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 1em;
      cursor: pointer;
      background-color: #F9E79F
    }
  </style>
</head>

<body>

  <h1>Random Quote Generator</h1>

  <div id="quote-box">
    <div id="quote">Click the button to get a quote!</div>
    <div id="author"></div>
  </div>

  <button onclick="getQuote()">Get Random Quote</button>

  <script>
    async function getQuote() {
      try {
        const response = await fetch("https://quote.cs260.click");
        const data = await response.json();

        document.getElementById("quote").textContent = "“" + data.quote + "”";
        document.getElementById("author").textContent = data.author
          ? "- " + data.author
          : "";
      } catch (error) {
        document.getElementById("quote").textContent = "Failed to fetch quote.";
        document.getElementById("author").textContent = "";
        console.error(error);
      }
    }
  </script>

</body>
</html>
